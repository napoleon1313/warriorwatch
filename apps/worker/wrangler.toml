name = "warriorwatch-api"
main = "src/index.ts"
compatibility_date = "2026-10-20"

[triggers]
# Every minute: scrape /FacilityOccupancy. Daily at 09:15 UTC (~5 AM Toronto): refresh the 44 facility pages.
crons = ["* * * * *", "15 9 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "warriorwatch"
# Production database, created 2026-10-28 with `wrangler d1 create warriorwatch` (region ENAM).
database_id = "ed515b4c-aa7e-4e7c-b144-cd32c96cb8b2"
migrations_dir = "migrations"

[observability]
enabled = true
